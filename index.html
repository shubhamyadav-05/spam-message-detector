<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Spam Detector</title>
</head>
<body>
  <h1>SMS Spam Detector</h1>
  <textarea id="msg" rows="5" cols="40" placeholder="Apna message yahan likho..."></textarea><br>
  <button id="checkBtn">Check karo</button>
  <p id="result"></p>

  <script>
    const btn = document.getElementById("checkBtn");
    const msgBox = document.getElementById("msg");
    const result = document.getElementById("result");

    btn.addEventListener("click", async () => {
      const message = msgBox.value.trim();
      if (message === "") {
        result.textContent = "Pehle message likho!";
        return;
      }

      result.textContent = "Check ho raha hai...";

      const response = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message })
      });

      const data = await response.json();
      result.textContent = data.label + " (" + data.confidence + "% sure)";
    });
  </script>
</body>
</html>
